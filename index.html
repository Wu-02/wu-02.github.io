<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Website Under Construction</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #202b3a; }
    main { max-width: 650px; text-align: center; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.035em; margin: 0 0 1rem; }
    p { font-size: 1.1rem; line-height: 1.75; color: #627083; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Website Under Construction</h1>
    <p>My personal website is currently under construction. Please check back soon.</p>
  </main>
</body>
</html>
